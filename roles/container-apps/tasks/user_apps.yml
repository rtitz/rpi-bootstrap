---
- name: Deploy application Systemd services definitions
  ansible.builtin.template:
    src: container-app.service.j2
    dest: "{{ container_user_home }}/.config/systemd/user/container-{{ item.name }}.service"
    owner: "{{ container_user }}"
    group: "{{ container_user }}"
    mode: '0644'
  become: true
  loop: "{{ monitored_containers }}"

- name: Register and enable all container services on boot via the user systemd bus
  ansible.builtin.command:
    cmd: "systemctl --user --machine={{ container_user }}@.host enable --now {{ item }}"
  become: true
  loop: "{{ monitored_containers | map(attribute='name') | map('regex_replace', '^(.*)$', 'container-\\1.service') | list }}"
  changed_when: false # Optional: You can refine this with a custom 'register' and 'failed_when' loop if desired

