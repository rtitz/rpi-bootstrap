---
- name: Deploy the background checker loop bash script
  ansible.builtin.template:
    src: podman-git-updater.sh.j2
    dest: "{{ container_user_home }}/.local/bin/podman-git-updater.sh"
    owner: "{{ container_user }}"
    group: "{{ container_user }}"
    mode: '0755'
  become: true

- name: Deploy background updater Systemd service and timer maps
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ container_user_home }}/.config/systemd/user/{{ item }}"
    owner: "{{ container_user }}"
    group: "{{ container_user }}"
    mode: '0644'
  become: true
  loop:
    - podman-git-updater.service
    - podman-git-updater.timer

- name: Register and enable all system services on boot via the user systemd bus
  ansible.builtin.command:
    cmd: "systemctl --user --machine={{ container_user }}@.host enable --now {{ item }}"
  become: true
  become_user: root
  loop:
    - "podman-git-updater.timer"
    - "podman.socket"
  changed_when: false # systemctl is self-validating and handles state skipping silently under the hood

