---
- name: Deploy optimized unified filesystem matrix template
  ansible.builtin.template:
    src: fstab.j2
    dest: /etc/fstab
    owner: root
    group: root
    mode: '0644'
  changed_when: false

# Dynamic journaling constraint adjustments based on active hardware layout
- name: Configure systemd-journald thresholds
  ansible.builtin.blockinfile:
    path: /etc/systemd/journald.conf
    insertafter: '^\[Journal\]'
    block: |
      Storage=persistent
      SystemMaxUse={{ '5G' if (enable_container | default(false)) else '150M' }}
      SystemMaxFileSize={{ '500M' if (enable_container | default(false)) else '50M' }}
  notify: Restart Journald

# Global swap mitigations
- name: Disable active system memory swap tracking lines instantly
  ansible.builtin.command: swapoff -a
  failed_when: false
  changed_when: false

- name: Suppress downstream dphys-swapfile engines (Raspberry Pi OS Specific)
  ansible.builtin.systemd:
    name: dphys-swapfile
    state: stopped
    enabled: no
  failed_when: false
  when: ansible_facts['os_family'] == "Debian" and ('raspberrypi' in ansible_facts['kernel'] or 'rpi' in ansible_facts['kernel'])

# BACKUP
- name: Deploy the backup execution script
  ansible.builtin.template:
    src: container-backup.sh.j2
    dest: /usr/local/bin/container-backup.sh
    mode: '0755'

- name: Deploy systemd backup service from template
  ansible.builtin.template:
    src: container-backup.service.j2
    dest: /etc/systemd/system/container-backup.service
    mode: '0644'
  notify: Restart backup timer

- name: Deploy systemd backup timer from template
  ansible.builtin.template:
    src: container-backup.timer.j2
    dest: /etc/systemd/system/container-backup.timer
    mode: '0644'
  notify: Restart backup timer

- name: Enable and start container backup timer
  ansible.builtin.systemd_service:
    name: container-backup.timer
    state: started
    enabled: true
    daemon_reload: true
