---
# ==============================================================================
# DEDICATED UNPRIVILEGED CONTAINER USER MANAGEMENT
# ==============================================================================
- name: Ensure the dedicated container execution user group exists
  ansible.builtin.group:
    name: "{{ container_user }}"
    state: present
    gid: "{{ container_gid }}"

- name: Ensure the dedicated container execution user account exists
  ansible.builtin.user:
    name: "{{ container_user }}"
    group: "{{ container_user }}"
    shell: /bin/bash
    create_home: yes
    home: "{{ container_user_home }}"
    uid: "{{ container_uid }}"
    system: yes # Secures the account by preventing interactive console password logins

- name: Ensure container user home directory has correct ownership
  ansible.builtin.file:
    path: "{{ container_user_home }}"
    state: directory
    owner: "{{ container_user }}"
    group: "{{ container_user }}"
    mode: '0755'
  become: true # Must run as root to fix the permissions lock

- name: Delegate subordinate namespace ranges for unprivileged runtime execution
  ansible.builtin.lineinfile:
    path: "/etc/{{ item }}"
    line: "{{ container_user }}:100000:65536"
    create: yes
    mode: '0644'
    owner: root
    group: root
  loop:
    - subuid
    - subgid

- name: Force persistent background lifecycles via user linger configuration
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ container_user }}"
    creates: "/var/lib/systemd/linger/{{ container_user }}"
  become: true

- name: Assign unprivileged container user to log management groups
  ansible.builtin.user:
    name: "{{ container_user }}"
    groups:
      - adm
      - systemd-journal
    append: yes
  become: true  # Runs as root to modify system groups

- name: Ensure target user configuration directories exist
  ansible.builtin.file:
    path: "{{ container_user_home }}/{{ item }}"
    state: directory
    owner: "{{ container_user }}"
    group: "{{ container_user }}"
    mode: '0700'
  become: true
  loop:
    - .local/bin
    - .config/systemd/user
    - .ssh

- name: Place the shared SSH private key for GitHub authentication
  ansible.builtin.copy:
    content: "{{ vault_container_ssh_key }}"
    dest: "{{ container_user_home }}/.ssh/id_ed25519"
    owner: "{{ container_user }}"
    group: "{{ container_user }}"
    mode: '0600'
  no_log: true
  become: true

- name: Configure global SSH options for the container user
  ansible.builtin.copy:
    content: |
      Host github.com
          IdentityFile ~/.ssh/id_ed25519
          StrictHostKeyChecking accept-new
    dest: "{{ container_user_home }}/.ssh/config"
    owner: "{{ container_user }}"
    group: "{{ container_user }}"
    mode: '0600'
  become: true

# ==============================================================================
# USER MAPPING WITH STORAGE
# ==============================================================================
- name: Create rootless engine storage folder within the shared partition
  ansible.builtin.file:
    path: "{{ storage_mount_path }}/container-user-storage"
    state: directory
    mode: '0700'
    owner: "{{ container_uid }}"
    group: "{{ container_gid }}"

- name: Validate user-level container engine folder hierarchy exists on host
  ansible.builtin.file:
    path: "{{ container_user_home }}/.local/share/containers"
    state: directory
    mode: '0755'
    owner: "{{ container_uid }}"
    group: "{{ container_gid }}"

- name: Check if rootless engine storage path target exists
  ansible.builtin.stat:
    path: "{{ container_user_home }}/.local/share/containers/storage"
  register: engine_storage_path_check

- name: Safely remove standard folder if it conflicts with intended symlink
  ansible.builtin.file:
    path: "{{ container_user_home }}/.local/share/containers/storage"
    state: absent
  when: 
    - engine_storage_path_check.stat.exists 
    - not engine_storage_path_check.stat.islnk

- name: Link rootless storage path directly to the storage pool via Symlink
  ansible.builtin.file:
    src: "{{ storage_mount_path }}/container-user-storage"
    dest: "{{ container_user_home }}/.local/share/containers/storage"
    state: link
    owner: "{{ container_uid }}"
    group: "{{ container_gid }}"

- name: Ensure external storage volume paths have correct unprivileged ownership
  ansible.builtin.file:
    path: "/mnt/storage"
    state: directory
    recurse: true
    owner: "{{ container_user }}"
    group: "{{ container_user }}"
    mode: '0755'
  become: true
