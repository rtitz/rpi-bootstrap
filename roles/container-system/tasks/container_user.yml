---
# ==============================================================================
# DEDICATED UNPRIVILEGED CONTAINER USER MANAGEMENT
# ==============================================================================
- name: Ensure the dedicated container execution user group exists
  ansible.builtin.group:
    name: "{{ container_user }}"
    state: present
    gid: "{{ container_gid }}"
  become: true
  become_user: root

- name: Ensure the dedicated container execution user account exists
  ansible.builtin.user:
    name: "{{ container_user }}"
    group: "{{ container_user }}"
    shell: /bin/bash
    create_home: true
    home: "{{ container_user_home }}"
    uid: "{{ container_uid }}"
    system: false # Leverages shadow-utils to auto-map subuid/subgid lines out-of-the-box
  become: true
  become_user: root

- name: Ensure container user home directory has correct ownership
  ansible.builtin.file:
    path: "{{ container_user_home }}"
    state: directory
    owner: "{{ container_user }}"
    group: "{{ container_user }}"
    mode: '0755'
  become: true 
  become_user: root

- name: Configure automatic user-space environment exports for interactive debugging
  ansible.builtin.blockinfile:
    path: "{{ container_user_home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED PODMAN DBUS PATHS"
    block: |
      export XDG_RUNTIME_DIR="/run/user/$(id -u)"
      export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus"
  become: true
  become_user: root

- name: Force persistent background lifecycles via user linger configuration
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ container_user }}"
    creates: "/var/lib/systemd/linger/{{ container_user }}"
  become: true
  become_user: root

- name: Assign unprivileged container user to log management groups
  ansible.builtin.user:
    name: "{{ container_user }}"
    groups:
      - adm
      - systemd-journal
    append: true
  become: true 
  become_user: root

- name: Ensure target user configuration directories exist
  ansible.builtin.file:
    path: "{{ container_user_home }}/{{ item }}"
    state: directory
    owner: "{{ container_user }}"
    group: "{{ container_user }}"
    mode: '0700'
  become: true
  become_user: root
  loop:
    - .local/bin
    - .config/systemd/user
    - .config/containers
    - .ssh

- name: Place the shared SSH private key for GitHub authentication
  ansible.builtin.copy:
    content: "{{ vault_container_ssh_key }}"
    dest: "{{ container_user_home }}/.ssh/id_ed25519"
    owner: "{{ container_user }}"
    group: "{{ container_user }}"
    mode: '0600'
  no_log: true
  become: true
  become_user: root

- name: Configure global SSH options for the container user
  ansible.builtin.copy:
    content: |
      Host github.com
          IdentityFile ~/.ssh/id_ed25519
          StrictHostKeyChecking accept-new
    dest: "{{ container_user_home }}/.ssh/config"
    owner: "{{ container_user }}"
    group: "{{ container_user }}"
    mode: '0600'
  become: true
  become_user: root

# ==============================================================================
# USER MAPPING WITH STORAGE
# ==============================================================================
- name: Create rootless engine storage folder within the shared partition
  ansible.builtin.file:
    path: "{{ storage_mount_path }}/container-user-storage"
    state: directory
    mode: '0700'
    owner: "{{ container_uid }}"
    group: "{{ container_gid }}"
  become: true
  become_user: root

- name: Validate user-level container engine folder hierarchy exists on host
  ansible.builtin.file:
    path: "{{ container_user_home }}/.local/share/containers"
    state: directory
    mode: '0755'
    owner: "{{ container_uid }}"
    group: "{{ container_gid }}"
  become: true
  become_user: root

- name: Check if rootless engine storage path target exists
  ansible.builtin.stat:
    path: "{{ container_user_home }}/.local/share/containers/storage"
  register: engine_storage_path_check
  become: true
  become_user: root

- name: Safely remove standard folder if it conflicts with intended symlink
  ansible.builtin.file:
    path: "{{ container_user_home }}/.local/share/containers/storage"
    state: absent
  when: 
    - engine_storage_path_check.stat.exists 
    - not engine_storage_path_check.stat.islnk
  become: true
  become_user: root

- name: Link rootless storage path directly to the storage pool via Symlink
  ansible.builtin.file:
    src: "{{ storage_mount_path }}/container-user-storage"
    dest: "{{ container_user_home }}/.local/share/containers/storage"
    state: link
    owner: "{{ container_uid }}"
    group: "{{ container_gid }}"
  become: true
  become_user: root

- name: Inject local container storage runtime override configuration
  ansible.builtin.copy:
    dest: "{{ container_user_home }}/.config/containers/storage.conf"
    owner: "{{ container_user }}"
    group: "{{ container_user }}"
    mode: '0644'
    content: |
      [storage]
      driver = "overlay"
      runroot = "{{ container_user_home }}/.local/share/containers/storage/run"
  become: true
  become_user: root

- name: Create global container engine config dir
  ansible.builtin.file:
    path: "/etc/containers/"
    state: directory
    mode: '0755'
  become: true
  become_user: root

- name: Deploy global container engine overrides to bypass system user runroot blocks
  ansible.builtin.copy:
    dest: "/etc/containers/containers.conf"
    owner: root
    group: root
    mode: '0644'
    content: |
      [engine]
      # Forces Podman to natively construct runtime paths inside the user's home directory
      # instead of defaulting to /run/user/UID for system accounts
      runtime_dir = "{{ container_user_home }}/.local/share/containers/storage/run"
  become: true
  become_user: root

- name: Ensure unprivileged container storage pool has correct recursive ownership
  ansible.builtin.file:
    path: "{{ storage_mount_path }}/container-user-storage"
    state: directory
    recurse: true
    owner: "{{ container_user }}"
    group: "{{ container_user }}"
    mode: '0700'
  become: true
  become_user: root
