---
# ==============================================================================
# STORAGE PROVISIONING
# ==============================================================================
- name: Establish target mounting nodes for the storage pool
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  become: true
  become_user: root
  loop:
    - "{{ storage_mount_path }}"
    - /var/lib/containers # Generic landing pad for container engine root layers

- name: Force immediate mount of the physical partition via label
  ansible.posix.mount:
    path: "{{ storage_mount_path }}"
    src: "LABEL={{ storage_label }}"
    fstype: btrfs # ext4
    opts: defaults,noatime,commit=30,compress=zstd:1,autodefrag,subvol=@storage,nofail # For ext4: defaults,noatime,commit=30,nofail
    state: mounted
  become: true
  become_user: root
  changed_when: false

- name: Generate persistent system directories inside the storage pool
  ansible.builtin.file:
    path: "{{ storage_mount_path }}/{{ item }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  become: true
  become_user: root
  loop:
    - system-logs
    - system-tmp
    - system-coredump
    - container-root
    - backup
    - home

- name: Check if storage log folder is already populated
  ansible.builtin.find:
    paths: "{{ storage_mount_path }}/system-logs"
  become: true
  become_user: root
  register: existing_storage_logs

- name: Sync active SD card logs to storage before the bind mount takes over
  ansible.builtin.command:
    cmd: "rsync -aX /var/log/ {{ storage_mount_path }}/system-logs/"
  become: true
  become_user: root
  when: 
    - ansible_facts['mounts'] | selectattr('mount', 'equalto', '/var/log') | list | length == 0
    - existing_storage_logs.matched == 0

# ==============================================================================
# AUTOMATED BTRFS PERFORMANCE AND INTEGRITY MAINTENANCE SYSTEM
# ==============================================================================
- name: Generate Btrfs maintenance worker engine scripts
  ansible.builtin.copy:
    dest: "/usr/local/bin/{{ item.name }}"
    owner: root
    group: root
    mode: '0755'
    content: "{{ item.content }}"
  become: true
  become_user: root
  loop:
    - name: btrfs-maintenance-balance.sh
      content: |
        #!/bin/bash
        # Filtered balance: Reclaims data/metadata chunks that are less than 50% utilized
        echo "Starting filtered space reclamation on {{ storage_mount_path }}..."
        /usr/bin/btrfs balance start -musage=50 -dusage=50 {{ storage_mount_path }}
    - name: btrfs-maintenance-scrub.sh
      content: |
        #!/bin/bash
        # Foreground scrub: Validates all SHA256/CRC32 data block checksums
        echo "Starting data block cryptographic verification on {{ storage_mount_path }}..."
        /usr/bin/btrfs scrub start -B {{ storage_mount_path }}

- name: Deploy Btrfs maintenance systemd service definitions
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item }}.service"
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Btrfs Maintenance Tool ({{ item }})
      After={{ storage_mount_path | regex_replace('^/', '') | regex_replace('/', '-') }}.mount
      Requires={{ storage_mount_path | regex_replace('^/', '') | regex_replace('/', '-') }}.mount

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/{{ item }}.sh
      IOSchedulingClass=idle
      CPUSchedulingPolicy=idle
  become: true
  become_user: root
  loop:
    - btrfs-maintenance-balance
    - btrfs-maintenance-scrub

- name: Deploy Btrfs maintenance scheduling timers
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}.timer"
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Trigger Schedule for {{ item.name }}
      After={{ storage_mount_path | regex_replace('^/', '') | regex_replace('/', '-') }}.mount

      [Timer]
      OnCalendar={{ item.schedule }} {{ timezone }}
      Persistent=true
      Unit={{ item.name }}.service

      [Install]
      WantedBy=timers.target
  become: true
  become_user: root
  loop:
    - name: btrfs-maintenance-balance
      schedule: "{{ btrfs_balance_schedule }}"
    - name: btrfs-maintenance-scrub
      schedule: "{{ btrfs_scrub_schedule }}"

- name: Force systemd daemon-reload and active-enable the maintenance grid
  ansible.builtin.systemd_service:
    name: "{{ item }}.timer"
    state: started
    enabled: true
    daemon_reload: true
  become: true
  become_user: root
  loop:
    - btrfs-maintenance-balance
    - btrfs-maintenance-scrub

# ==============================================================================
# BIND MOUNT ENFORCEMENT (REQUIRED TO MATCH REPO LAYOUT)
# ==============================================================================
- name: Configure persistent system and engine bind mounts in /etc/fstab
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.src }}"
    fstype: none
    opts: "defaults,bind,noatime,nofail"
    state: mounted
  become: true
  loop:
    - { path: "/var/log", src: "{{ storage_mount_path }}/system-logs" }
    - { path: "/var/tmp", src: "{{ storage_mount_path }}/system-tmp" }
    - { path: "/var/lib/containers", src: "{{ storage_mount_path }}/container-root" }
    - { path: "/var/lib/systemd/coredump", src: "{{ storage_mount_path }}/system-coredump" }

- name: Ensure correct file permission modes on active system runtime nodes
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
    owner: root
    group: "{{ item.group | default('root') }}"
  become: true
  become_user: root
  loop:
    - { path: "/var/log", mode: "0755", group: "root" }
    - { path: "/var/tmp", mode: "1777" } # 1777 enforces the sticky bit required for system shared tmp
    - { path: "/var/lib/containers", mode: "0711" } # 0711 lets rootless graph drivers explore nested boundaries
    - { path: "/var/lib/systemd/coredump", mode: "0755" } # Required for secure systemd-coredump processing

- name: Force systemd-journald to persist logs on the external storage partition
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?Storage='
    line: 'Storage=persistent'
    state: present
  become: true
  become_user: root
  notify: Restart Journald
