---
# ==============================================================================
# SYSTEM PACKAGE PROVISIONING
# ==============================================================================
- name: Synchronize apt caching indices and deploy the container runtime stack
  ansible.builtin.apt:
    name:
      - podman
      - podman-compose  # Managed natively via system packages, avoiding Python PIP
      - podman-docker   # Adds the 'docker' command alias wrapper for compatibility
      - uidmap          # Mandated requirement for unprivileged user namespaces
      - rsync           # Engine dependency for our storage synchronization syncs
      - fuse-overlayfs  # Ensures rootless overlay storage mounts function on flash drives
    state: present
    update_cache: yes

# ==============================================================================
# GLOBAL ENGINE RUNTIME CONFIGURATION SAFEGUARDS
# ==============================================================================
- name: Inspect presence of the global container storage profile
  ansible.builtin.stat:
    path: /etc/containers/storage.conf
  register: target_storage_conf_check

- name: Generate default storage.conf template if completely missing
  ansible.builtin.copy:
    content: |
      [storage]
      driver = "overlay"
      
      [storage.options]
      mount_program = "/usr/bin/fuse-overlayfs"
    dest: /etc/containers/storage.conf
    owner: root
    group: root
    mode: '0644'
  when: not target_storage_conf_check.stat.exists

- name: Force default filesystem tracking parameter metrics to OverlayFS if file existed
  ansible.builtin.lineinfile:
    path: /etc/containers/storage.conf
    regexp: '^driver\s*=\s*'
    line: 'driver = "overlay"'
  when: target_storage_conf_check.stat.exists

