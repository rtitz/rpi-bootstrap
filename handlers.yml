---
- name: Restart Journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
    daemon_reload: yes

- name: Systemd daemon reload
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart SSH
  ansible.builtin.service:
    name: "{{ item }}"
    state: restarted
  loop:
    - ssh
    - sshd
  failed_when: false

- name: Reload UFW firewall
  community.general.ufw:
    state: reloaded

- name: Reboot
  ansible.builtin.reboot:
    msg: "Ansible triggered a reboot to apply the updated system state."
    reboot_timeout: 120
