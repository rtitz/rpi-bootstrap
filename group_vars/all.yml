---
# Timezone
timezone: "UTC" # Europe/Berlin

# Toggle feature flags
enable_ufw_firewall: false

# Container storage feature flag
enable_container: true

# Configurable hardware targets (for containers)
storage_label: "data"
storage_mount_path: "/mnt/storage"

# Btrfs maintenance schedules (Systemd format)
btrfs_balance_schedule: "Sun *-*-* 03:00:00" # Filtered chunk space optimization (Runs weekly on Sundays at 03:00 AM)
btrfs_scrub_schedule: "*-*-01 01:00:00"     # Cryptographic bit rot check block (Runs monthly on the 1st at 01:00 AM)

# Backup configuration
backup_schedule: "*-*-* 04:00:00" # Main point-in-time snapshot and sync routine (Runs daily at 04:00 AM)
backup_destination: "{{ storage_mount_path }}/backup"
backup_keep_count: 10
backup_keep_count_btrfs_snapshots: 21
backup_containers_to_stop_before_backup: "" # Space separated list of systemd service names to stop before backup and restart after backup

# Target user configurations for rootless container runtimes (for containers)
container_user: "container"  # {{ ansible_user }} defaults to your current SSH deployment user
container_uid: 1001
container_gid: 1001
container_user_home: "{{ storage_mount_path }}/home/{{ container_user }}"
container_ssh_key: "{{ vault_container_ssh_key }}" # PUBLIC KEY IS: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO/T9Cr9TnhGMGGVkf1RIjyN1RzAohLSIJJSGBS7VV+Q

# Simplified container tracking registry
monitored_containers:
  - name: homeassistant
    repo_url: "git@github.com:rtitz/homeassistant-container.git"
    branch: main
    present: true
    enabled: true

  - name: wallbox-controller
    repo_url: "git@github.com:rtitz/wallbox-controller.git"
    branch: main
    present: true
    enabled: true

  - name: solar-monitor
    repo_url: "git@github.com:rtitz/solar-monitor.git"
    branch: main
    present: true
    enabled: false

  - name: wallbox-monitor
    repo_url: "git@github.com:rtitz/wallbox-monitor.git"
    branch: main
    present: true
    enabled: false

  - name: go-nofity
    repo_url: "git@github.com:rtitz/go-notify.git"
    branch: main
    present: true
    enabled: true

  - name: go-r53-dyndns
    repo_url: "git@github.com:rtitz/go-r53-dyndns.git"
    branch: main
    present: true
    enabled: false
